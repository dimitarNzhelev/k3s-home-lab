apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: logs
  namespace: logging
spec:
  version: 9.4.3
  count: 1
  elasticsearchRef:
    name: logs
  http:
    tls:
      # TLS is terminated by the tailscale Ingress.
      selfSignedCertificate:
        disabled: true
  config:
    server.publicBaseUrl: https://kibana.tail652475.ts.net
    # No login screen: everyone lands in Kibana as the ES anonymous user
    # (tailnet-only endpoint). Basic login stays available as a fallback at
    # /login?auth_provider_hint=basic.
    xpack.security.authc.providers:
      anonymous.anonymous1:
        order: 0
        credentials: elasticsearch_anonymous_user
      basic.basic1:
        order: 1
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
