apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: logs
  namespace: logging
spec:
  version: 9.4.3
  count: 1
  elasticsearchRef:
    name: logs
  http:
    tls:
      # TLS is terminated by the tailscale Ingress.
      selfSignedCertificate:
        disabled: true
  config:
    server.publicBaseUrl: https://kibana.tail652475.ts.net
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
