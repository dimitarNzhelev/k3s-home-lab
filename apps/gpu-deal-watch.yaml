apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-deal-watch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dimitarNzhelev/k3s-home-lab.git
    targetRevision: main
    path: manifests/gpu-deal-watch   # kustomize: watch.py → ConfigMap, plus the CronJob and its PVC
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
